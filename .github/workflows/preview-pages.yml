name: NEXUS preview (development branch)
on:
  workflow_dispatch:
  push:
    branches:
      - art-direction/atrium-preproduction
    paths:
      - 'index.html'
      - 'src/**'
      - 'academy.html'
      - 'curriculum/**'
      - 'public/**'
      - '.github/workflows/preview-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nexus-pages-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/art-direction/atrium-preproduction'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages if site is not initialized
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build original 3D reactor
        run: |
          python -m pip install 'trimesh==4.8.3' 'numpy==2.3.3'
          python tools/build_reactor.py
          test -s public/assets/nexus-core-sculpture.glb
      - name: Assemble isolated static preview
        run: |
          mkdir -p _preview/src _preview/public/assets _preview/curriculum
          cp index.html _preview/index.html
          cp academy.html _preview/
          cp curriculum/*.json _preview/curriculum/
          cp src/*.js _preview/src/
          cp public/assets/nexus-core-sculpture.glb _preview/public/assets/
          printf 'NEXUS preview â€” experimental branch; not a production release.\n' > _preview/PREVIEW.txt
          test -s _preview/index.html
      - name: Archive playable preview independently of Pages
        uses: actions/upload-artifact@v4
        with:
          name: nexus-playable-preview
          path: _preview/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _preview
      - id: deployment
        uses: actions/deploy-pages@v4
