name: Atrium browser evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'curriculum/**'
      - 'package*.json'
      - 'tests/**'
      - '.github/workflows/atrium-browser.yml'
jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Generate the actual GLB before rendering
        run: |
          python3 -m pip install 'trimesh==4.8.3' 'numpy==2.3.3'
          python3 tools/build_reactor.py
          test -s public/assets/nexus-core-sculpture.glb
      - name: Serve static project
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nexus-http.log 2>&1 &
          sleep 2
      - run: npm test
      - name: Complete learning sequence with real Python
        run: node tests/learning-browser.cjs
      - name: Deterministic swept-collision regression gate
        run: node tests/collision-gate.cjs
      - name: Blocking mobile and signage regression gate
        run: node tests/quality-gate.cjs
      - name: Capture real engine screenshots
        run: node tests/atrium-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-real-browser-captures
          path: artifacts/
          if-no-files-found: warn
