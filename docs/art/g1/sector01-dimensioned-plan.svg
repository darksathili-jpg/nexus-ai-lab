<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">NEXUS Secteur 01 : plan coté et coupe de principe G1</title>
<desc id="desc">Salle 40 par 68 mètres, hauteur 18. Banc central de rayon 8,6 mètres. Console à x12 z moins10 et arrivée à z moins30. La caméra derrière l'arrivée sort du volume proposé : écart non résolu.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="3" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#59666c"/></marker><style>text{font-family:Arial,sans-serif;fill:#20282e;font-size:15px}.h{font-size:25px;font-weight:bold}.small{font-size:12px}.dim{stroke:#59666c;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow)}.note{fill:#895614}</style></defs>
<rect width="1200" height="1000" fill="#f3f1ec"/>
<text x="45" y="40" class="h">NEXUS / S01 — PLAN COTÉ G1</text><text x="45" y="65">Dessin 2D de conception • dimensions contractuelles proposées • aucun modèle 3D</text>
