<circle cx="280" cy="848" r="5" fill="#dfa24d"/><line x1="280" y1="768" x2="280" y2="843" stroke="#dfa24d" stroke-dasharray="3 3"/><text x="300" y="849" class="note">caméra initiale : z ≈ −38,78 m</text>
<text x="89" y="113">z = +34</text><text x="89" y="824">z = −34</text><text x="80" y="883">Échelle du plan : 10 unités SVG = 1 m ; nord = +Z</text>
<line x1="85" y1="914" x2="185" y2="914" stroke="#20282e" stroke-width="3"/><text x="85" y="936">0</text><text x="163" y="936">10 m</text>
<text x="620" y="126" class="h">IMPLANTATION ET LÉGENDE</text>
<text x="620" y="162">Repère actuel conservé : X horizontal, Y vertical, Z nord.</text>
<text x="620" y="190">Sol plat Y = 0 ; aucune plateforme parcourable.</text>
<text x="620" y="224">Pointillés cyan : centre joueur autorisé par les limites</text><text x="620" y="244">actuelles X ±19,5 m / Z ±33,5 m, hors obstacles.</text>
<text x="620" y="278">Banc : rayon visuel ≤8,6 m ; cercle orange = exclusion</text><text x="620" y="298">du centre joueur à 9,1 m (corps de rayon 0,5 m).</text>
<text x="620" y="332">M03 : centre (12 ; −10), orientation −0,35 rad.</text><text x="620" y="352">Rectangle = collider 3,10 × 1,56 m, pas tout le signe.</text>
<text x="620" y="386">Anneau cyan : dégagement de travail 2 m autour</text><text x="620" y="406">du disque enveloppant la console ; vérifier le signe.</text>
<text x="620" y="440">Chemin cyan = trajet proposé, largeur libre ≥2 m.</text><text x="620" y="460">Les baies en relief et rails restent hors zone autorisée.</text>
<text x="620" y="494" class="note">ÉCART CAMÉRA : arrière du spawn hors salle.</text><text x="620" y="514" class="note">Prévoir vestibule caméra ou revoir le contrat, après accord.</text>
<text x="620" y="557" class="h">COUPE TRANSVERSALE DE PRINCIPE</text>
<rect x="660" y="600" width="400" height="180" fill="#dce0df" stroke="#20282e" stroke-width="2"/>
<path d="M665 778L665 690L680 620L705 605M1055 778L1055 690L1040 620L1015 605" fill="none" stroke="#66737b" stroke-width="5"/>
<rect x="774" y="710" width="172" height="70" fill="#66737b"/><text x="804" y="751">banc H 7 m</text>
<line x1="1090" y1="600" x2="1090" y2="780" class="dim"/><text x="1101" y="691">18 m</text>
<line x1="660" y1="804" x2="1060" y2="804" class="dim"/><text x="837" y="827">40 m</text>
<text x="620" y="865">Ribs et baies : volumes proposés, non dimensionnés ici.</text><text x="620" y="887">Aucun débord au sol dans le domaine de déplacement.</text>
<text x="620" y="923">Perspectives artistiques : intentions, pas preuve métrique.</text>
<text x="45" y="980" class="small">G1 • 11 octobre 2026 • référence 7d31fae • validation humaine en attente • aucune intégration</text>
